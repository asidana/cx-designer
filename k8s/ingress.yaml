apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-cx-designer
  namespace: agentic-cx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - cx-designer.yourdomain.com
      secretName: agentic-cx-tls
  rules:
    - host: cx-designer.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-cx-designer
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentic-cx-designer
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agentic-cx-designer
                port:
                  number: 8000

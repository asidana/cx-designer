apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-cx-designer
  namespace: default
  labels:
    app: agentic-cx-designer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentic-cx-designer
  template:
    metadata:
      labels:
        app: agentic-cx-designer
    spec:
      containers:
        - name: app
          image: your-registry/agentic-cx-designer:latest
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 8000
              name: backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-cx-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-cx-secrets
                  key: redis-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-cx-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-cx-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-cx-designer
  namespace: default
spec:
  selector:
    app: agentic-cx-designer
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
    - name: backend
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-cx-designer
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - cx-designer.yourdomain.com
      secretName: agentic-cx-tls
  rules:
    - host: cx-designer.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-cx-designer
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentic-cx-designer
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agentic-cx-designer
                port:
                  number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentic-cx-designer
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentic-cx-designer
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

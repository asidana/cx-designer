apiVersion: v1
kind: Secret
metadata:
  name: agentic-cx-secrets
  namespace: default
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/agentic_cx"
  redis-url: "redis://redis:6379"
  openai-api-key: "sk-..."
  anthropic-api-key: "sk-ant-..."
  aws-access-key-id: "AKIA..."
  aws-secret-access-key: "..."
  jwt-secret: "your-jwt-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-cx-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_PORT: "8000"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://cx-designer.yourdomain.com"
